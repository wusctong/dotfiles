# Font
font_size 15
font_family          Monaspace Krypton NF Regular
bold_font            Monaspace Krypton NF Bold
italic_font          Monaspace Krypton NF Italic
bold_italic_font     Monaspace Krypton NF Bold Italic
# -> !=
disable_ligatures cursor

# Window
hide_window_decorations        titlebar-only
window_padding_width           12
background_opacity             0.9
background_blur                45
remember_window_size           yes

# Tab bar
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted

# General key mapping
macos_option_as_alt yes 

# Animation
enable_audio_bell no
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0

# Import theme
include themes/tni.conf

# Change Editor
editor nvim

# Use Fish Shell
# shell /opt/homebrew/bin/fish
