add_newline = true
command_timeout = 800

format = "$directory$git_branch$git_status$cmd_duration$package\n$character"

[character]
success_symbol = "[>](bold yellow)"
error_symbol   = "[>](bold red)"

[directory]
style = "cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

# =========================
# Git status (identical symbols)
# =========================
[git_status]
style = "yellow"
format = " [$all_status$ahead_behind]($style)"

staged     = "+${count}"
modified   = "!${count}"
untracked  = "?${count}"
deleted    = "-${count}"
renamed    = "${count}"
conflicted = "=${count}"
stashed    = "⚑${count}"

ahead     = " ↑${count}"
behind    = " ↓${count}"
diverged  = " ↑${ahead_count}↓${behind_count}"

[cmd_duration]
disabled = false

[jobs]
disabled = true

[package]
disabled = false
